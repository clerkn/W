<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Card Shop</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial;background:linear-gradient(135deg,#0a0a2a,#0f0f3a);min-height:100vh;color:#fff;padding:20px;}
        .container{max-width:500px;margin:0 auto;}
        .card{background:rgba(255,255,255,0.1);border-radius:20px;padding:25px;margin-bottom:20px;border:1px solid #00ff88;text-align:center;}
        h2{color:#00ff88;margin-bottom:20px;}
        h3{color:#00ff88;margin:15px 0;}
        input{width:100%;padding:12px;margin:10px 0;background:#1a1a3a;border:1px solid #00ff88;border-radius:10px;color:#fff;font-size:16px;box-sizing:border-box;}
        button{width:100%;padding:12px;background:#00ff88;border:none;border-radius:10px;color:#0a0a2a;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px;}
        button.secondary{background:#333;color:#fff;}
        .product{background:#1a1a3a;padding:15px;margin:10px 0;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;}
        .product-price{color:#00ff88;font-weight:bold;}
        .hidden{display:none;}
        .option-btn{background:#0088cc;margin:5px;width:48%;display:inline-block;}
        .delivery-option{display:flex;gap:10px;margin:15px 0;}
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const BOT_TOKEN = "8674826347:AAEuZgw8-gPqjFHT18EeNSo4WP9tgkET3aU";
const OWNER_ID = "8558052873";

let currentUser = null;
let cart = [];
let deliveryMethod = null;
let deliveryValue = null;

function saveUser(user){
    let users = JSON.parse(localStorage.getItem('users') || '{}');
    users[user.phone] = user;
    localStorage.setItem('users', JSON.stringify(users));
}

function getUsers(){
    return JSON.parse(localStorage.getItem('users') || '{}');
}

function showMessage(msg){
    let m = document.getElementById('msg');
    if(m){ m.innerText = msg; setTimeout(()=>{ m.innerText = ''; },3000); }
    else alert(msg);
}

function showLogin(){
    document.getElementById('app').innerHTML = `
        <div class="card">
            <h2>🔐 GIFT CARD SHOP</h2>
            <div id="msg" style="color:#00ff88;"></div>
            <input type="tel" id="phone" placeholder="Phone Number">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <button onclick="showRegister()" class="secondary">New User? Register</button>
        </div>
    `;
}

function showRegister(){
    document.getElementById('app').innerHTML = `
        <div class="card">
            <h2>📝 REGISTER</h2>
            <div id="msg" style="color:#00ff88;"></div>
            <input type="text" id="name" placeholder="Full Name">
            <input type="tel" id="regPhone" placeholder="Phone Number">
            <input type="password" id="regPassword" placeholder="Password">
            <button onclick="register()">Register</button>
            <button onclick="showLogin()" class="secondary">Back</button>
        </div>
    `;
}

function showShop(){
    const products = [
        {n:"Amazon ₹100", p:50},{n:"Amazon ₹200", p:100},{n:"Amazon ₹500", p:250},{n:"Amazon ₹1000", p:499},
        {n:"Flipkart ₹100", p:50},{n:"Flipkart ₹200", p:100},{n:"Flipkart ₹500", p:250},
        {n:"Google Play ₹100", p:50},{n:"Telegram Premium", p:250},{n:"Tashan Win", p:50},{n:"DM Win", p:50},{n:"Jai Club", p:50}
    ];
    let html = `<div class="card"><h2>🛍️ Welcome ${currentUser.name}</h2><div id="msg" style="color:#00ff88;"></div>`;
    products.forEach(p => {
        html += `<div class="product" onclick="addToCart('${p.n}',${p.p})"><span>${p.n}</span><span class="product-price">₹${p.p}</span></div>`;
    });
    html += `<button onclick="viewCart()">🛒 Cart (${cart.length})</button>
             <button onclick="logout()" class="secondary" style="background:#ff4444;">Logout</button></div>
             <div id="cartModal" class="card hidden"></div>
             <div id="deliveryModal" class="card hidden"></div>
             <div id="payModal" class="card hidden"></div>`;
    document.getElementById('app').innerHTML = html;
}

function addToCart(n,p){
    if(!currentUser){ showMessage("Login first"); return; }
    cart.push({n,p});
    showMessage("Added to cart!");
}

function viewCart(){
    if(cart.length===0){ showMessage("Cart empty"); return; }
    let total = 0, items = "";
    cart.forEach((item,i)=>{
        total += item.p;
        items += `<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #333;"><span>${item.n}</span><span>₹${item.p}</span><button onclick="removeItem(${i})" style="width:auto;background:#ff4444;padding:5px 10px;">X</button></div>`;
    });
    document.getElementById('cartModal').innerHTML = `<h3>Your Cart</h3>${items}<hr><strong>Total: ₹${total}</strong><br><br><button onclick="showDeliveryOptions(${total})">Proceed to Delivery</button><button onclick="closeCart()" class="secondary">Close</button>`;
    document.getElementById('cartModal').classList.remove('hidden');
}

function removeItem(i){ cart.splice(i,1); viewCart(); }
function closeCart(){ document.getElementById('cartModal').classList.add('hidden'); }

function showDeliveryOptions(total){
    closeCart();
    document.getElementById('deliveryModal').innerHTML = `
        <h3>📬 Choose Delivery Method</h3>
        <div class="delivery-option">
            <button class="option-btn" onclick="showEmailForm(${total})">📧 Email</button>
            <button class="option-btn" onclick="showTelegramForm(${total})">📱 Telegram</button>
        </div>
        <button onclick="closeDelivery()" class="secondary">Back</button>
    `;
    document.getElementById('deliveryModal').classList.remove('hidden');
}

function closeDelivery(){
    document.getElementById('deliveryModal').classList.add('hidden');
}

function showEmailForm(total){
    deliveryMethod = "email";
    document.getElementById('deliveryModal').innerHTML = `
        <h3>📧 Enter Your Email</h3>
        <input type="email" id="deliveryValue" placeholder="Enter email address">
        <button onclick="saveDeliveryAndProceed(${total})">Continue to Payment</button>
        <button onclick="showDeliveryOptions(${total})" class="secondary">Back</button>
    `;
}

function showTelegramForm(total){
    deliveryMethod = "telegram";
    document.getElementById('deliveryModal').innerHTML = `
        <h3>📱 Enter Your Telegram ID</h3>
        <input type="text" id="deliveryValue" placeholder="Enter Telegram ID (e.g., @username or 123456789)">
        <button onclick="saveDeliveryAndProceed(${total})">Continue to Payment</button>
        <button onclick="showDeliveryOptions(${total})" class="secondary">Back</button>
    `;
}

function saveDeliveryAndProceed(total){
    deliveryValue = document.getElementById('deliveryValue').value;
    if(!deliveryValue){
        alert("Please enter your " + (deliveryMethod === "email" ? "email" : "Telegram ID"));
        return;
    }
    closeDelivery();
    showPayment(total);
}

function showPayment(total){
    const upi = `upi://pay?pa=ninadxclerk@fam&am=${total}&cu=INR`;
    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upi)}`;
    document.getElementById('payModal').innerHTML = `
        <h3>💳 PAYMENT</h3>
        <img src="${qr}" style="width:200px;margin:15px auto;display:block;">
        <p>UPI: <strong>ninadxclerk@fam</strong></p>
        <p>Total Amount: <strong style="color:#00ff88;">₹${total}</strong></p>
        <input type="text" id="utr" placeholder="Enter UTR / Transaction ID">
        <button onclick="submitPay(${total})">Submit Payment</button>
        <button onclick="closePay()" class="secondary">Cancel</button>
    `;
    document.getElementById('payModal').classList.remove('hidden');
}

function closePay(){ document.getElementById('payModal').classList.add('hidden'); }

function submitPay(total){
    let utr = document.getElementById('utr').value;
    if(!utr){ showMessage("Enter UTR"); return; }
    
    let itemsList = cart.map(i => i.n).join(", ");
    
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            chat_id: OWNER_ID,
            text: `🆕 NEW ORDER!\n\nUser: ${currentUser.name}\nPhone: ${currentUser.phone}\n\n📦 Items: ${itemsList}\n💰 Total: ₹${total}\n📬 Delivery Method: ${deliveryMethod}\n📫 Delivery To: ${deliveryValue}\n💳 UTR: ${utr}\n\n⏰ Time: ${new Date().toLocaleString()}`
        })
    });
    
    let orders = JSON.parse(localStorage.getItem(`orders_${currentUser.phone}`) || '[]');
    orders.push({items:cart, total, utr, deliveryMethod, deliveryValue, date:new Date().toISOString()});
    localStorage.setItem(`orders_${currentUser.phone}`, JSON.stringify(orders));
    
    showMessage("Order placed! Gift card will be sent to your " + deliveryMethod + " within 24 hours.");
    cart = [];
    closePay();
    showShop();
}

function register(){
    let name = document.getElementById('name').value;
    let phone = document.getElementById('regPhone').value;
    let pwd = document.getElementById('regPassword').value;
    if(!name||!phone||!pwd){ showMessage("Fill all"); return; }
    let users = getUsers();
    if(users[phone]){ showMessage("Phone exists"); return; }
    saveUser({name, phone, password:pwd});
    showMessage("Registered! Please login.");
    showLogin();
}

function login(){
    let phone = document.getElementById('phone').value;
    let pwd = document.getElementById('password').value;
    let users = getUsers();
    let user = users[phone];
    if(user && user.password === pwd){
        currentUser = user;
        showShop();
    } else { showMessage("Invalid phone or password"); }
}

function logout(){ currentUser = null; cart = []; showLogin(); }

showLogin();
</script>
</body>
</html>
